[package]
name = "disposable-heroes"
version = "0.1.0"
edition = "2024"
default-run = "disposable-heroes"

[features]
default = ["game"]
game = ["dep:bevy", "dep:models", "dep:sound"]
asset-export = ["game", "models/export"]

[dependencies]
models = { path = "../models", optional = true }
sound = { path = "../sound", optional = true }
bevy = { version = "=0.20.1", optional = true, default-features = false, features = ["3d", "ui", "audio", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[[bin]]
name = "disposable-heroes"
path = "src/main.rs"
required-features = ["game"]


[[bin]]
name = "asset-gallery"
path = "src/bin/asset-gallery.rs"
required-features = ["game"]

[[bin]]
name = "asset-export"
path = "src/bin/asset-export.rs"
required-features = ["asset-export"]
