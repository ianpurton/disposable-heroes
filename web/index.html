<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Disposable Heroes</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090e10}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module">
    import init from './disposable_heroes.js';
    window.addEventListener('error', event => console.error('Disposable Heroes:', event.error || event.message));
    window.addEventListener('unhandledrejection', event => console.error('Disposable Heroes async error:', event.reason));
    try {
      if (!navigator.gpu) {
        throw new Error('WebGPU is unavailable. Use a WebGPU-capable browser with hardware acceleration over HTTPS.');
      }
      if (!await navigator.gpu.requestAdapter()) {
        throw new Error('No WebGPU adapter is available. Check browser GPU support and hardware acceleration.');
      }
      await init();
      // Wavedash injects its SDK into the hosting page.
      if (window.Wavedash) window.Wavedash.init({debug: false});
    } catch (error) {
      console.error('Game failed to start:', error);
      document.body.textContent = 'Unable to load Disposable Heroes: ' + (error instanceof Error ? error.message : String(error));
    }
  </script>
</body>
</html>
